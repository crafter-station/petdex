name: petdex-desktop-windows

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-windows.yml"
      - "packages/petdex-desktop-windows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-windows.yml"
      - "packages/petdex-desktop-windows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (cargo check)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust/Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/petdex-desktop-windows/src-tauri -> target

      - name: Generate Cargo.lock
        working-directory: packages/petdex-desktop-windows/src-tauri
        run: cargo generate-lockfile

      - name: Upload generated Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: petdex-desktop-windows-Cargo.lock
          path: packages/petdex-desktop-windows/src-tauri/Cargo.lock

      - name: Check Rust
        working-directory: packages/petdex-desktop-windows/src-tauri
        run: cargo check --locked

  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust/Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/petdex-desktop-windows/src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate Cargo.lock
        working-directory: packages/petdex-desktop-windows/src-tauri
        run: cargo generate-lockfile

      - name: Build Tauri
        working-directory: packages/petdex-desktop-windows
        run: cargo tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: petdex-desktop-windows-${{ github.run_id }}
          path: |
            packages/petdex-desktop-windows/src-tauri/target/release/bundle/msi/*.msi
            packages/petdex-desktop-windows/src-tauri/target/release/bundle/nsis/*.exe
