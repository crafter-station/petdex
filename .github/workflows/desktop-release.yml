name: petdex-desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "desktop-v* tag to publish (created from the selected branch if it doesn't exist). Leave empty to reuse the selected tag's name."
        required: false
      windows_only:
        description: "Skip the macOS builds and release only the Windows portable exe (for fork/Windows testing)"
        type: boolean
        default: false

jobs:
  build:
    name: build ${{ matrix.target }}
    # Skipped on a windows_only manual run so a fork can cut a Windows-only
    # test release without spending mac runner minutes or being blocked by
    # the Zig/zero-native build. Tag pushes leave windows_only unset → runs.
    if: ${{ !inputs.windows_only }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-13

    steps:
      - name: Checkout petdex
        uses: actions/checkout@v4
        with:
          # github.ref follows the ref selected for the run: the pushed
          # desktop-v* tag on push, or the branch/tag picked in the
          # "Run workflow" dropdown on manual dispatch.
          ref: ${{ github.ref }}

      - name: Clone zero-native
        # build.zig resolves zero-native from -Dzero-native-path flag, the
        # ZERO_NATIVE_PATH env var, or ../../zero-native (in that order).
        # CI passes the checkout path explicitly via the env var so we
        # don't have to patch build.zig at runtime.
        #
        # Source defaults to Railly/zero-native:feature/window-resize because
        # the floating-window options + window.resize + focusable flag aren't
        # in vercel-labs/main yet. The feature/window-resize branch builds on
        # top of feature/floating-window (the PR currently in review). Update
        # ZERO_NATIVE_REMOTE / ZERO_NATIVE_BRANCH once everything merges
        # upstream so CI can switch to vercel-labs/main.
        env:
          ZERO_NATIVE_REMOTE: "https://github.com/Railly/zero-native.git"
          ZERO_NATIVE_BRANCH: "feature/window-resize"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$ZERO_NATIVE_BRANCH" "$ZERO_NATIVE_REMOTE" "$GITHUB_WORKSPACE/zero-native"
          echo "ZERO_NATIVE_PATH=$GITHUB_WORKSPACE/zero-native/" >> "$GITHUB_ENV"

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v1
        with:
          version: "0.16.0"

      - name: Build petdex-desktop
        working-directory: packages/petdex-desktop
        run: |
          zig build -Doptimize=ReleaseSafe -Dzero-native-path="$ZERO_NATIVE_PATH"
          mv zig-out/bin/petdex-desktop "petdex-desktop-${{ matrix.target }}"
          ls -lh "petdex-desktop-${{ matrix.target }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: petdex-desktop-${{ matrix.target }}
          path: packages/petdex-desktop/petdex-desktop-${{ matrix.target }}

  build-windows:
    name: build win32-x64 (portable exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/petdex-desktop-windows
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      # --no-bundle: skip MSI/NSIS installers, we ship the portable exe so the
      # CLI install model (~/.petdex/bin/petdex-desktop.exe) works like mac/linux.
      # The exe embeds the frontend; only WebView2 (present on Win10/11) is needed.
      - name: Build portable exe
        run: npm run tauri-build -- --no-bundle

      # Cargo bin name is `petdex-win` (see src-tauri/Cargo.toml [[bin]]); rename
      # to the asset name the CLI's findBinaryAsset() expects for win32-x64.
      - name: Rename to release asset name
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/petdex-win.exe" "petdex-desktop-win32-x64.exe"
          Get-Item "petdex-desktop-win32-x64.exe" | Format-List Name, Length

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: petdex-desktop-win32-x64
          # path is relative to repo root, not the job's working-directory
          path: packages/petdex-desktop-windows/petdex-desktop-win32-x64.exe

  sidecar:
    name: build sidecar (server.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build sidecar
        working-directory: packages/petdex-desktop/sidecar
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
          ls -lh server.js

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: petdex-desktop-sidecar
          path: packages/petdex-desktop/sidecar/server.js

  release:
    name: publish github release
    needs: [build, build-windows, sidecar]
    # Publish as long as Windows + sidecar succeeded. mac is allowed to be
    # 'skipped' (windows_only run) but a real mac 'failure' still blocks the
    # release so production tag pushes never ship missing mac binaries.
    if: >-
      ${{ !cancelled()
          && needs.build-windows.result == 'success'
          && needs.sidecar.result == 'success'
          && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout petdex
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          find artifacts -type f -name "petdex-desktop-*" -exec cp {} release/ \;
          # Rename sidecar so the asset name is unambiguous in GH Releases.
          if [ -f artifacts/petdex-desktop-sidecar/server.js ]; then
            cp artifacts/petdex-desktop-sidecar/server.js release/petdex-desktop-sidecar.js
          fi
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, github.ref_name is the desktop-v* tag. On manual
          # dispatch from a branch, pass release_tag (e.g. desktop-v0.2.2-win)
          # — action-gh-release creates the tag at the built commit. The tag
          # must start with desktop-v so the CLI's release filter finds it.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
