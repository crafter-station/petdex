name: desktop-rust-ci

on:
  push:
    paths:
      - "crates/**"
      - ".github/workflows/desktop-rust-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - ".github/workflows/desktop-rust-ci.yml"
  workflow_dispatch:

jobs:
  rust-core:
    name: rust-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run petdex-core tests
        working-directory: crates/petdex-core
        run: cargo test

  macos-swift:
    name: macos-swift
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build petdex-core release static library
        working-directory: crates/petdex-core
        run: cargo build --release

      - name: Build petdex-macos Swift package
        working-directory: crates/petdex-macos
        run: swift build

  windows-native:
    name: windows-native
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test and build petdex-windows
        working-directory: crates/petdex-windows
        run: |
          cargo test
          cargo build --release

      - name: Live smoke test petdex-windows on Windows runner
        shell: pwsh
        run: |
          $exe = Resolve-Path "crates/petdex-windows/target/release/petdex-windows.exe"
          $logOut = "windows-smoke.out.log"
          $logErr = "windows-smoke.err.log"
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr
          try {
            $tokenPath = Join-Path $env:USERPROFILE ".petdex\runtime\update-token"
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) {
                throw "petdex-windows.exe exited early with code $($proc.ExitCode)"
              }
              if (Test-Path $tokenPath) {
                try {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:7777/health" -TimeoutSec 2
                  if ($health.ok -eq $true) {
                    $ready = $true
                    break
                  }
                } catch {}
              }
              Start-Sleep -Milliseconds 300
            }
            if (-not $ready) {
              throw "HookServer or update-token did not become ready in time"
            }

            $token = (Get-Content -Path $tokenPath -Raw).Trim()
            Write-Host "Health OK. Token length: $($token.Length)"

            $payload = @{
              session_id = "win-ci-smoke"
              agent = "claude-code"
              status = "needs_input"
              summary = "Windows full-native smoke test OK!"
            } | ConvertTo-Json -Compress

            $postRes = Invoke-WebRequest -Method Post -Uri "http://127.0.0.1:7777/bubble" `
              -Headers @{ "x-petdex-update-token" = $token } `
              -ContentType "application/json" `
              -Body $payload `
              -UseBasicParsing
            if ($postRes.StatusCode -ne 200) {
              throw "POST /bubble returned $($postRes.StatusCode)"
            }
            Write-Host "POST /bubble -> $($postRes.StatusCode)"

            Start-Sleep -Milliseconds 500
            $state = Invoke-RestMethod -Uri "http://127.0.0.1:7777/state" -TimeoutSec 2
            Write-Host "GET /state -> $($state | ConvertTo-Json -Compress)"
            if ($state.pet_state -ne "waiting") {
              throw "Expected pet_state=waiting after needs_input bubble, got $($state.pet_state)"
            }

            if ($proc.HasExited) {
              throw "petdex-windows.exe crashed after bubble"
            }

            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
              $gfx = [System.Drawing.Graphics]::FromImage($bmp)
              $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bmp.Save("windows-smoke.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $gfx.Dispose()
              $bmp.Dispose()
              Write-Host "Captured windows-smoke.png ($($bounds.Width)x$($bounds.Height))"
            } catch {
              Write-Host "Screenshot capture skipped on headless session: $($_.Exception.Message)"
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path $logOut) { Write-Host "--- stdout ---"; Get-Content $logOut }
            if (Test-Path $logErr) { Write-Host "--- stderr ---"; Get-Content $logErr }
          }

      - name: Upload Windows smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petdex-windows-smoke
          path: windows-smoke.png
          if-no-files-found: ignore

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis crates/petdex-windows/installer/petdex.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path "crates/petdex-windows/installer/Petdex-Setup.exe" -Destination "Petdex-Setup.exe" -Force

      - name: Sign Petdex-Setup.exe with SignPath.io (optional)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          $orgId = $env:SIGNPATH_ORGANIZATION_ID
          $projectSlug = if ($env:SIGNPATH_PROJECT_SLUG) { $env:SIGNPATH_PROJECT_SLUG } else { "petdex" }
          $policySlug = if ($env:SIGNPATH_SIGNING_POLICY_SLUG) { $env:SIGNPATH_SIGNING_POLICY_SLUG } else { "release-signing" }
          if (-not $orgId) {
            throw "SIGNPATH_ORGANIZATION_ID secret is required when SIGNPATH_API_TOKEN is set"
          }

          $headers = @{ Authorization = "Bearer $($env:SIGNPATH_API_TOKEN)" }
          $submitUri = "https://app.signpath.io/API/v1/$orgId/SigningRequests"
          $form = @{
            ProjectSlug = $projectSlug
            SigningPolicySlug = $policySlug
            Artifact = Get-Item -Path "Petdex-Setup.exe"
          }
          $response = Invoke-WebRequest -Method Post -Uri $submitUri -Headers $headers -Form $form -UseBasicParsing
          $requestUrl = $response.Headers["Location"]
          if (-not $requestUrl) {
            throw "SignPath did not return a SigningRequest Location header"
          }

          $signedUrl = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            $status = Invoke-RestMethod -Uri $requestUrl -Headers $headers
            if ($status.status -eq "Completed") {
              $signedUrl = $status.signedArtifactLink
              break
            }
            if ($status.status -in @("Failed", "Denied", "Canceled")) {
              throw "SignPath signing request ended with status: $($status.status)"
            }
          }
          if (-not $signedUrl) {
            throw "Timed out waiting for SignPath signing request"
          }

          Invoke-WebRequest -Uri $signedUrl -Headers $headers -OutFile "Petdex-Setup.exe" -UseBasicParsing
          Write-Host "Successfully signed Petdex-Setup.exe via SignPath.io"

      - name: Package Windows release binary
        shell: pwsh
        run: |
          Compress-Archive -Path crates/petdex-windows/target/release/petdex-windows.exe -DestinationPath petdex-windows-x86_64.zip -Force

      - name: Upload Windows release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: petdex-windows-x86_64
          path: petdex-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload Windows NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Petdex-Setup
          path: Petdex-Setup.exe
          if-no-files-found: error
