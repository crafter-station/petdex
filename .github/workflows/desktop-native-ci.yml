name: petdex-desktop-native ci

# The release workflow only runs on a tag, so a change that breaks a
# platform stays invisible until someone cuts a release. This builds
# every target the app claims in app.zon on each push that touches it.
#
# Building is not the bar. The hook server regression on this branch
# compiled cleanly on every platform and still answered 401 to every
# authenticated POST, so Linux and Windows also run the binary, drive a
# real hook round trip, and photograph the screen. The screenshots are
# uploaded as artifacts because a human still has to look at them.
#
# All three pass now, so none of them is allowed to fail: a change that
# breaks a platform fails this check instead of being waved through.
# What a green Windows leg still does not prove is the desktop-session
# behavior of its Win32 paths, since the runner has no interactive
# desktop: topmost ordering, the black color key against real wallpaper,
# and click-through are compile-and-launch verified only.
#
# Deep links are the second thing here that builds could not prove. The
# petdex:// handling exists on all three hosts, but it was fired by hand
# on macOS only: the SDK commit that added GTK's ::open and Win32's argv
# path says outright that no real link was ever fired on Linux or
# Windows. Those two legs now do, end to end, and assert on the pet that
# lands on disk rather than on a log line.
#
# macOS is the leg deliberately left out. Its host receives links through
# NSApplicationDelegate application:openURLs:, which needs a real
# LaunchServices-registered bundle, and there is no argv shortcut the way
# Win32 has one. Registering one means packaging and `lsregister -f -R
# -trusted`, and desktop-release.yml already refuses to build a macOS
# bundle on CI because an adhoc-signed one is rejected by Gatekeeper
# everywhere but the machine that built it. Adding that here would be a
# packaging path this workflow does not otherwise exercise, mutating the
# runner's LaunchServices database, to re-prove the one platform already
# verified by hand. It stays out until something makes it cheap.

on:
  push:
    paths:
      - "packages/petdex-desktop-native/**"
      - ".github/workflows/desktop-native-ci.yml"
  pull_request:
    paths:
      - "packages/petdex-desktop-native/**"
      - ".github/workflows/desktop-native-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.expected_to_fail }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
            expected_to_fail: false
          - platform: linux
            runner: ubuntu-latest
            expected_to_fail: false
          # A real Windows box, not a cross-compile: the Win32 paths
          # (cmd hook launcher, the ACL fallback for the token file,
          # `cmd /c start`) only run here, and cross-compiling proves
          # none of them.
          - platform: windows
            runner: windows-2022
            expected_to_fail: false
    env:
      HERDR_PLUGIN_SOURCE: ${{ (github.event.pull_request.head.repo.full_name || github.repository) }}/packages/petdex-desktop-native/integrations/herdr
      HERDR_PLUGIN_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout petdex
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Herdr (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          curl -fsSL https://herdr.dev/install.sh -o "$RUNNER_TEMP/install-herdr.sh"
          HERDR_INSTALL_DIR="$RUNNER_TEMP/herdr" sh "$RUNNER_TEMP/install-herdr.sh"
          echo "$RUNNER_TEMP/herdr" >> "$GITHUB_PATH"

      - name: Install Herdr (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\install-herdr.ps1"
          Invoke-WebRequest -Uri "https://herdr.dev/install.ps1" -OutFile $installer
          & $installer -InstallDir "$env:RUNNER_TEMP\herdr"
          "$env:RUNNER_TEMP\herdr" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install managed Herdr plugin
        shell: bash
        working-directory: packages/petdex-desktop-native/integrations/herdr
        run: bun run managed-smoke.ts install

      - name: Install Linux GUI libraries
        # The SDK's Linux host links gtk4. Cross-compiling this from
        # macOS fails on a missing gtk4 that says nothing about the code,
        # which is the whole reason this job builds on a real Linux
        # runner. WebKitGTK is deliberately absent: this app declares no
        # web layer, so the build compiles the GTK host with the stub
        # define and drops the webkitgtk link.
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # webp-pixbuf-loader is the part that matters for pets. gdk-pixbuf
          # decodes through loader plugins, and Ubuntu ships none for webp
          # by default, so every sheet in the catalog (60 of 63 are .webp)
          # fails to decode and the window comes up empty. libwebp alone is
          # not enough: that is the codec, this is the plugin that reaches it.
          sudo apt-get install -y libgtk-4-dev libx11-dev pkg-config webp-pixbuf-loader

      - name: Clone the Native SDK
        # Pinned to the same commit desktop-release.yml uses: the
        # floating/transparent window options and fx.focusWindow this app
        # needs are not in vercel-labs/main yet. The two pins have to move
        # together: a CI that proves one SDK while the release compiles
        # another makes this check green about a binary nobody ships.
        #
        # af0812f1 is what carries the deep-link work the steps below
        # exercise: 247f5802 added GTK's ::open and Win32's argv path,
        # af0812f1 added the Windows single-instance channel. Under the
        # old pin the deep-link steps would test an SDK where a link to a
        # running Windows app went nowhere.
        env:
          NATIVE_SDK_REMOTE: "https://github.com/Railly/native.git"
          NATIVE_SDK_BRANCH: "feat/floating-window-0.5.3"
          NATIVE_SDK_REF: "c0b10d027efa490fc99a3bc7f1cf88b015999d45"
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_BRANCH" "$NATIVE_SDK_REMOTE" "$GITHUB_WORKSPACE/native-sdk"
          git -C "$GITHUB_WORKSPACE/native-sdk" fetch --depth 1 origin "$NATIVE_SDK_REF"
          git -C "$GITHUB_WORKSPACE/native-sdk" checkout --detach "$NATIVE_SDK_REF"
          echo "NATIVE_SDK_PATH=$GITHUB_WORKSPACE/native-sdk" >> "$GITHUB_ENV"

      - name: Apply Petdex Native SDK patches
        shell: bash
        run: scripts/patch-native-sdk.sh

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build the native CLI from the pinned SDK
        # The published CLI carries its own manifest parser and the
        # released one rejects app.zon's `.floating` with a bare
        # ParseZon, so the CLI has to come from the same commit.
        working-directory: ${{ env.NATIVE_SDK_PATH }}
        shell: bash
        run: |
          zig build cli
          echo "NATIVE_CLI=$NATIVE_SDK_PATH/zig-out/bin/native" >> "$GITHUB_ENV"

      - name: Build petdex-desktop-native
        working-directory: packages/petdex-desktop-native
        shell: bash
        run: |
          # Match the release build: baseline x86-64, so CI exercises
          # the same instruction set users actually get. See the note in
          # desktop-release.yml.
          "$NATIVE_CLI" build -Dcpu=baseline -Dtrace=off
          ls -lh zig-out/bin/

      - name: Run the test suite
        # The suite ran on nobody's machine until the root aggregator
        # existed: `zig build test` collects tests from the root module
        # file only, so the imported files' tests (agent_hooks' config
        # merging, hook_runner's payload parsing, installer's URL
        # checks) compiled green and never executed. Fixture homes are
        # relative to the package's ignored `.zig-cache` now, so the
        # same assertions run on Windows too.
        working-directory: packages/petdex-desktop-native
        shell: bash
        run: |
          "$NATIVE_CLI" test .

      - name: Test remote helper runtimes
        if: matrix.platform != 'windows'
        working-directory: packages/petdex-desktop-native
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/remote_watchers_test.py
          sh -n src/assets/petdex-remote-hook.sh
          sh tests/remote_hook_test.sh
          sh tests/tunnel_supervisor_test.sh

      # Compiling proves nothing about whether the app draws: the hook
      # server regression that shipped in this branch compiled fine on
      # every platform. These steps run the binary, exercise the hook
      # round trip, and photograph the screen so a human can see the pet.

      - name: Install a pet (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.petdex/pets/ci-pet
          # A known-good v2 atlas from the live catalog, so a decode
          # failure here is the platform codec, never a bad fixture.
          curl -fsSL -o ~/.petdex/pets/ci-pet/spritesheet.webp \
            "$(curl -fsSL https://petdex.dev/api/install-pet/boba | sed -n 's/.*"spritesheetUrl":"\([^"]*\)".*/\1/p')"
          printf '{"id":"ci-pet","displayName":"CI Pet","description":"ci","spritesheetPath":"spritesheet.webp"}' \
            > ~/.petdex/pets/ci-pet/pet.json
          ls -lh ~/.petdex/pets/ci-pet/

      - name: Install a pet (Windows)
        # PowerShell, not bash: git-bash's `~` is not $env:USERPROFILE on
        # this runner, so the bash version wrote the pet somewhere the
        # app never looks and the app reported NoPetInstalled with the
        # files sitting right there.
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\.petdex\pets\ci-pet"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $meta = Invoke-RestMethod -Uri "https://petdex.dev/api/install-pet/boba"
          Invoke-WebRequest -Uri $meta.pet.spritesheetUrl -OutFile "$dir\spritesheet.webp"
          '{"id":"ci-pet","displayName":"CI Pet","description":"ci","spritesheetPath":"spritesheet.webp"}' |
            Set-Content -Path "$dir\pet.json" -NoNewline
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize

      - name: Exercise managed Herdr plugin (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: packages/petdex-desktop-native
        run: |
          set -euo pipefail
          PETDEX_PET=ci-pet ./zig-out/bin/petdex-desktop-native > herdr-smoke.log 2>&1 &
          APP_PID=$!
          for _ in $(seq 1 60); do
            test -s "$HOME/.petdex/runtime/update-token" && break
            kill -0 "$APP_PID" || { cat herdr-smoke.log; exit 1; }
            sleep 1
          done
          test -s "$HOME/.petdex/runtime/update-token"
          bun run integrations/herdr/managed-smoke.ts action
          kill "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

      - name: Run and exercise the hook server (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: packages/petdex-desktop-native
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb imagemagick x11-utils
          # Xvfb gives the GTK host a real display to draw into; without
          # one the app has nothing to present to and the screenshot
          # would prove nothing.
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          PETDEX_PET=ci-pet ./zig-out/bin/petdex-desktop-native > run.log 2>&1 &
          APP_PID=$!
          sleep 10
          kill -0 "$APP_PID" || { echo "app died"; cat run.log; exit 1; }
          TOKEN=$(cat ~/.petdex/runtime/update-token)
          bun run integrations/herdr/managed-smoke.ts action
          curl -fsS -X POST -H "x-petdex-update-token: $TOKEN" \
            -H "Content-Type: application/json" -d '{"state":"running"}' \
            http://127.0.0.1:7777/state
          echo
          curl -fsS http://127.0.0.1:7777/state
          echo
          import -window root /tmp/linux-screen.png
          # The first run drew a titled window with a blank interior:
          # frames present, the sheet decodes, nothing paints. These
          # narrow it down. GTK's renderer matters because the default
          # picks GL, which has no driver under Xvfb; the cairo fallback
          # says whether that is the reason.
          echo "=== window tree ==="
          xwininfo -root -tree | head -20 || true
          echo "=== app log (full) ==="
          cat run.log
          kill "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true
          sleep 2
          echo "=== retry with the cairo renderer ==="
          GSK_RENDERER=cairo PETDEX_PET=ci-pet ./zig-out/bin/petdex-desktop-native > cairo.log 2>&1 &
          CAIRO_PID=$!
          sleep 10
          import -window root /tmp/linux-screen-cairo.png || true
          kill "$CAIRO_PID" || true
          tail -20 cairo.log

      # Deep links were verified by hand on macOS only. GTK's ::open path
      # and Win32's argv path shipped with the SDK commit above carrying an
      # explicit "no real deep link was fired on a Linux or Windows
      # machine". The unit tests prove the payload decodes, not that a
      # link ever reaches the app. These two steps close that: the whole
      # chain, from the OS handing over the URI to a pet on disk.
      #
      # The assertion is deliberately the INSTALL, not a log line. A
      # `petdex://<slug>` for a pet the app does not have has to resolve
      # the slug against the 1.4MB manifest, download pet.json, download
      # the spritesheet, and mirror both into the second root. Files with
      # real byte counts at the end mean every one of those ran; a log
      # line would only mean the event was decoded.

      - name: Fire a real deep link (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: packages/petdex-desktop-native
        run: |
          set -euo pipefail

          # gio, not xdg-open. Both would work in a desktop session, but
          # xdg-open's own man page says it "is for use inside a desktop
          # session only": it dispatches per detected desktop environment
          # and this runner has none, so it falls into a generic path that
          # prefers a browser for anything URL-shaped. `gio open` goes
          # straight through GIO's GAppInfo lookup, which reads the
          # desktop-file cache and nothing else. Both packages are named
          # explicitly rather than leaned on: libglib2.0-bin (gio) does
          # arrive transitively via libgtk-4-dev -> libglib2.0-dev, but a
          # transitive dependency is not a contract, and dbus-daemon and
          # desktop-file-utils are on neither runner image list.
          # x11-utils for xdpyinfo, which is how the display check below
          # avoids starting a second Xvfb on a display that already has
          # one. Named here rather than leaned on from the hook-server
          # step, so this step does not depend on that one having run.
          sudo apt-get install -y libglib2.0-bin desktop-file-utils dbus-daemon xvfb imagemagick x11-utils

          # The GTK host resolves its scheme through a .desktop entry, so
          # one has to exist before anything can be opened. `native package
          # --target linux` is what writes it (share/applications/, with
          # MimeType=x-scheme-handler/petdex from app.zon's url_schemes),
          # so the entry is generated by the same code a release uses
          # instead of hand-written here, where it could drift.
          "$NATIVE_CLI" package --target linux \
            --binary zig-out/bin/petdex-desktop-native \
            --output "$RUNNER_TEMP/pkg-linux"
          # Globbed, not named: the entry's basename is the app id
          # (dev.petdex.desktop-native), which GApplication also owns on
          # the session bus. Hardcoding either spelling here would go
          # stale the next time app.zon's id or name moves.
          DESKTOP_SRC=$(ls "$RUNNER_TEMP"/pkg-linux/share/applications/*.desktop 2>/dev/null | head -1)
          test -n "$DESKTOP_SRC" || { echo "package wrote no .desktop entry"; exit 1; }
          grep -q "x-scheme-handler/petdex" "$DESKTOP_SRC" || {
            echo "the .desktop entry does not claim the petdex scheme:"; cat "$DESKTOP_SRC"; exit 1; }

          # Exec= is the bare binary name ("petdex-desktop-native" %U), so
          # the launcher resolves it on PATH. Nothing puts the build output
          # on PATH here, and a link that "works" by silently launching
          # nothing is exactly the false pass being avoided, so the binary
          # is symlinked into ~/.local/bin before the entry is installed.
          mkdir -p ~/.local/bin ~/.local/share/applications
          ln -sf "$PWD/zig-out/bin/petdex-desktop-native" ~/.local/bin/petdex-desktop-native
          export PATH="$HOME/.local/bin:$PATH"
          cp "$DESKTOP_SRC" ~/.local/share/applications/
          update-desktop-database ~/.local/share/applications
          echo "=== registered handler ==="
          gio mime x-scheme-handler/petdex

          # Everything below shares ONE D-Bus session on purpose.
          # GApplication's uniqueness and its ::open delivery run over the
          # session bus (GLib: "On Linux, the D-Bus session bus is used for
          # communication"), and the runner has no session. Without a bus
          # the app and the `gio open` would each be their own primary and
          # the link would launch a second process instead of reaching the
          # running one, which is the case this step exists to prove.
          export DISPLAY=:99
          # The hook-server step already started Xvfb on :99 and left it
          # running, so starting a second one here dies with "Server is
          # already active for display 99" and every app launched below
          # then has no display at all. Reuse it, and only start one if
          # that step was skipped.
          xdpyinfo -display :99 >/dev/null 2>&1 || {
            Xvfb :99 -screen 0 1280x800x24 &
            sleep 3
          }
          # That step also leaves its own app instance behind. GApplication
          # is single-instance per app id, so a survivor would answer the
          # link from OUTSIDE this D-Bus session, where the scenario below
          # can neither see it nor assert on it.
          pkill -f petdex-desktop-native || true
          sleep 2

          cat > /tmp/deeplink.sh <<'SCENARIO'
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          PETDEX_PET=ci-pet petdex-desktop-native > /tmp/deeplink-run.log 2>&1 &
          APP_PID=$!
          sleep 10
          kill -0 "$APP_PID" || { echo "app died before the link"; cat /tmp/deeplink-run.log; exit 1; }

          # A slug the app does NOT have. `petdex://ci-pet` would match the
          # pet installed by hand above, and on_urls_opened answers an
          # already-installed slug with a plain select_pet that never
          # touches the network: a green step that proved only that a
          # string was parsed. paperclip forces the install path.
          gio open "petdex://paperclip"

          # Poll, never sleep-and-hope. Three sequential network fetches
          # run behind this link (1.4MB manifest, pet.json, 1.35MB sheet)
          # over whatever the runner's egress is that minute; a fixed wait
          # long enough to be safe is dead time on every green run, and one
          # short enough to be quick is a flake generator.
          for _ in $(seq 1 60); do
            if [ -s "$HOME/.petdex/pets/paperclip/pet.json" ] \
               && [ -s "$HOME/.petdex/pets/paperclip/spritesheet.webp" ]; then
              break
            fi
            sleep 2
          done

          # Liveness is asserted HERE, inside the D-Bus session, while
          # the process still exists. dbus-run-session reaps its children
          # when the scenario returns, so the same check outside sees a
          # dead PID for an app that handled the link perfectly and
          # reports the opposite of what happened.
          kill -0 "$APP_PID" || { echo "FAIL: the app died handling the deep link"; exit 1; }
          echo "app still alive after the link: $APP_PID"
          SCENARIO
          chmod +x /tmp/deeplink.sh

          dbus-run-session -- bash /tmp/deeplink.sh

          echo "=== app log ==="
          cat /tmp/deeplink-run.log || true
          echo "=== ~/.petdex/pets ==="
          ls -lR ~/.petdex/pets || true
          # Both roots, because the mirror into .codex is asserted below
          # and a bare "it is missing" says nothing about whether the
          # directory was created empty or never touched at all.
          echo "=== ~/.codex/pets ==="
          ls -lR ~/.codex/pets || true

          import -window root /tmp/linux-screen-deeplink.png || true

          PET_JSON="$HOME/.petdex/pets/paperclip/pet.json"
          SHEET="$HOME/.petdex/pets/paperclip/spritesheet.webp"
          test -s "$PET_JSON" || { echo "FAIL: the deep link never wrote pet.json"; exit 1; }
          test -s "$SHEET" || { echo "FAIL: the deep link never wrote the spritesheet"; exit 1; }
          # Size, not existence. `curl --fail` keeps an HTTP error page out
          # of these files, but a truncated or empty write would still
          # satisfy `test -s`, and a 1.35MB sheet arriving as a few hundred
          # bytes is the failure that looks like a pass.
          SHEET_BYTES=$(stat -c %s "$SHEET")
          echo "spritesheet: $SHEET_BYTES bytes"
          [ "$SHEET_BYTES" -gt 500000 ] || { echo "FAIL: spritesheet is $SHEET_BYTES bytes, expected ~1.35MB"; exit 1; }
          # The install writes both roots (installer.install_roots): a pet
          # only in .petdex is invisible to Codex Desktop, which is a real
          # half-install and not a detail.
          test -s "$HOME/.codex/pets/paperclip/spritesheet.webp" || {
            echo "FAIL: the pet was never mirrored into the .codex root"; exit 1; }

          # No kill and no liveness check here. Surviving the link matters
          # as much as acting on it, but that is asserted inside the
          # scenario, where the process still exists: dbus-run-session
          # reaps the app along with its shell when it returns. Naming
          # APP_PID out here is an unbound variable, and under set -u that
          # failed the step after every assertion had already passed.

      - name: Run and exercise the hook server (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: packages/petdex-desktop-native
        run: |
          # Everything diagnostic runs before anything that can throw.
          # The first version put the log dump after the token read, so
          # a missing token killed the step and the app's own output
          # never reached the log, leaving nothing to diagnose.
          $ErrorActionPreference = "Continue"
          $env:PETDEX_PET = "ci-pet"
          $app = Start-Process -FilePath ".\zig-out\bin\petdex-desktop-native.exe" `
            -RedirectStandardOutput run.log -RedirectStandardError run.err -PassThru
          Start-Sleep -Seconds 12

          "=== process ==="
          if ($app.HasExited) { "EXITED, code $($app.ExitCode)" } else { "alive, pid $($app.Id)" }

          "=== stdout ==="; Get-Content run.log -ErrorAction SilentlyContinue
          "=== stderr ==="; Get-Content run.err -ErrorAction SilentlyContinue

          "=== ~/.petdex tree ==="
          Get-ChildItem "$env:USERPROFILE\.petdex" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 40 FullName, Length | Format-Table -AutoSize

          "=== listening on 7777 ==="
          Get-NetTCPConnection -LocalPort 7777 -State Listen -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, OwningProcess | Format-Table -AutoSize

          "=== titled windows ==="
          Get-Process | Where-Object { $_.MainWindowTitle } |
            Select-Object ProcessName, MainWindowTitle | Format-Table -AutoSize

          # GDI capture of the whole desktop: the only way to see whether
          # the window actually painted on this runner.
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:TEMP\windows-screen.png")
          "screenshot saved"

          $tokenPath = "$env:USERPROFILE\.petdex\runtime\update-token"
          if (Test-Path $tokenPath) {
            $token = Get-Content $tokenPath -Raw
            $herdrServer = Start-Process -FilePath (Get-Command herdr).Source `
              -ArgumentList "server" -RedirectStandardOutput herdr.log `
              -RedirectStandardError herdr.err -PassThru
            $herdrReady = $false
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              if ((herdr status server) -match "status:\s+running") {
                $herdrReady = $true
                break
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not $herdrReady) {
              Get-Content herdr.log -ErrorAction SilentlyContinue
              Get-Content herdr.err -ErrorAction SilentlyContinue
              throw "Herdr server did not start"
            }
            bun run integrations/herdr/managed-smoke.ts action
            $bridgeExit = $LASTEXITCODE
            "=== Herdr plugin logs ==="
            herdr plugin log list --plugin dev.petdex.bridge --limit 20
            "=== hook round trip ==="
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:7777/state" `
              -Headers @{ "x-petdex-update-token" = $token } `
              -ContentType "application/json" -Body '{"state":"running"}' | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri "http://127.0.0.1:7777/state" | ConvertTo-Json -Compress
            herdr server stop
            $herdrServer.WaitForExit(10000) | Out-Null
            if ($bridgeExit -ne 0) { throw "managed Herdr action failed" }
          } else {
            "NO TOKEN at $tokenPath"
          }

          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $tokenPath)) { throw "token was never written" }

      - name: Fire a real deep link (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: packages/petdex-desktop-native
        run: |
          # NOTE: both cases below invoke the exe DIRECTLY with the URL as
          # an argument. That is not the same thing as proving the scheme
          # is registered. `native package --target windows` emits
          # install/register-file-types.ps1, which writes
          # HKCU\Software\Classes\petdex with a shell\open\command; what it
          # writes there is `<exe> "%1"`, so a user clicking a link and
          # this step reach the SAME code: commandLineUrls() reading
          # argv[1..] via CommandLineToArgvW. What stays unverified here is
          # only the registry write itself, deliberately: applying it would
          # mutate the runner's user hive for whatever runs next, and the
          # SDK already covers the script's contents under test.
          $ErrorActionPreference = "Stop"
          $exe = ".\zig-out\bin\petdex-desktop-native.exe"
          $petDir = "$env:USERPROFILE\.petdex\pets\paperclip"
          $codexDir = "$env:USERPROFILE\.codex\pets\paperclip"
          Remove-Item -Recurse -Force $petDir, $codexDir -ErrorAction SilentlyContinue

          # Case 1, cold launch: no instance running, so this process
          # claims the mutex, becomes primary, and emits its own command
          # line after START. paperclip is a slug the app does NOT have;
          # an installed one short-circuits to select_pet and never proves
          # the manifest lookup or the download ran.
          $env:PETDEX_PET = "ci-pet"
          $cold = Start-Process -FilePath $exe -ArgumentList "petdex://paperclip" `
            -RedirectStandardOutput cold.log -RedirectStandardError cold.err -PassThru

          # Poll rather than sleep: a cold-launch link runs three
          # sequential fetches (1.4MB manifest, pet.json, 1.35MB sheet) and
          # a fixed wait is either dead time or a flake.
          for ($i = 0; $i -lt 60; $i++) {
            if ((Test-Path "$petDir\pet.json") -and (Test-Path "$petDir\spritesheet.webp")) { break }
            Start-Sleep -Seconds 2
          }

          "=== cold launch stdout ==="; Get-Content cold.log -ErrorAction SilentlyContinue
          "=== cold launch stderr ==="; Get-Content cold.err -ErrorAction SilentlyContinue
          Get-ChildItem $petDir -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize

          if ($cold.HasExited) { throw "the app exited during a cold deep-link launch, code $($cold.ExitCode)" }
          if (-not (Test-Path "$petDir\pet.json")) { throw "cold launch: the deep link never wrote pet.json" }
          $sheet = Get-Item "$petDir\spritesheet.webp" -ErrorAction SilentlyContinue
          if (-not $sheet) { throw "cold launch: the deep link never wrote the spritesheet" }
          # Size, not existence: curl --fail keeps error pages out of these
          # files, but a truncated write still leaves a file behind, and a
          # 1.35MB sheet landing as a few hundred bytes is the failure that
          # reads as a pass.
          "spritesheet: $($sheet.Length) bytes"
          if ($sheet.Length -lt 500000) { throw "cold launch: spritesheet is $($sheet.Length) bytes, expected ~1.35MB" }
          if (-not (Test-Path "$codexDir\spritesheet.webp")) { throw "cold launch: the pet was never mirrored into the .codex root" }

          # Case 2, the bug af0812f1 fixed. Before it, a link clicked while
          # the app ran started a second process that emitted the event
          # into its OWN startup and died, so the window the user was
          # looking at never heard it. Now a named mutex (Local\, so it is
          # per-session and both of these processes see the same one)
          # decides the role at create: this second launch must find the
          # mutex taken, forward its URLs over WM_COPYDATA, and return from
          # run before creating any window.
          Remove-Item -Recurse -Force "$env:USERPROFILE\.petdex\pets\dalek", `
            "$env:USERPROFILE\.codex\pets\dalek" -ErrorAction SilentlyContinue
          $second = Start-Process -FilePath $exe -ArgumentList "petdex://dalek" `
            -RedirectStandardOutput second.log -RedirectStandardError second.err -PassThru

          # A secondary does no work beyond forwarding, so this is a real
          # wait for exit, not a poll. 30s is slack for process startup on
          # a loaded runner, not an expected duration.
          $exited = $second.WaitForExit(30000)
          "=== second process stdout ==="; Get-Content second.log -ErrorAction SilentlyContinue
          "=== second process stderr ==="; Get-Content second.err -ErrorAction SilentlyContinue

          # The whole point of the single-instance channel: the second
          # process is a courier. Still alive means it took the primary
          # role and is showing its own window, which is the pre-af0812f1
          # behavior this asserts against.
          if (-not $exited) {
            Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue
            throw "the second launch never exited: it opened its own window instead of forwarding to the running instance"
          }
          "second process exit code: $($second.ExitCode)"

          # And the forward has to have LANDED, not merely been sent. The
          # primary re-validates every WM_COPYDATA field before emitting,
          # so a rejected payload would look identical from the outside up
          # to this point: only the pet on disk separates them.
          $dalekDir = "$env:USERPROFILE\.petdex\pets\dalek"
          for ($i = 0; $i -lt 60; $i++) {
            if ((Test-Path "$dalekDir\pet.json") -and (Test-Path "$dalekDir\spritesheet.webp")) { break }
            Start-Sleep -Seconds 2
          }
          Get-ChildItem $dalekDir -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize

          if ($cold.HasExited) { throw "the running instance died handling a forwarded deep link, code $($cold.ExitCode)" }
          if (-not (Test-Path "$dalekDir\pet.json")) { throw "the forwarded deep link never reached the running instance: no pet.json" }
          $dalekSheet = Get-Item "$dalekDir\spritesheet.webp" -ErrorAction SilentlyContinue
          if (-not $dalekSheet) { throw "the forwarded deep link never reached the running instance: no spritesheet" }
          # A far lower floor than paperclip's, because dalek's sheet is a
          # genuinely small 15.9KB. The bar is "not a stub", not a size
          # copied from the other pet: asserting ~1.35MB here would fail on
          # a correct install.
          "dalek spritesheet: $($dalekSheet.Length) bytes"
          if ($dalekSheet.Length -lt 8000) { throw "forwarded link: dalek spritesheet is $($dalekSheet.Length) bytes, expected ~15.9KB" }

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:TEMP\windows-screen-deeplink.png")

          Stop-Process -Id $cold.Id -Force -ErrorAction SilentlyContinue

      - name: Remote agent writeback over real SSH (Linux)
        # The remote-agents feature's whole promise is that ssh argv built
        # on the desktop drives a fetch-merge-writeback on a remote. Unit
        # tests prove the argv and the merge; only a real sshd proves the
        # round trip. An isolated container supplies the remote loopback:
        # unlike an sshd on the runner itself, its 127.0.0.1:7777 is free for
        # the reverse tunnel. That lets CI prove the security order too:
        # tunnel health -> hook patch -> atomic token -> feed.
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: packages/petdex-desktop-native
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          cleanup_remote_smoke() {
            if [ -n "${APP_PID:-}" ]; then kill "$APP_PID" 2>/dev/null || true; fi
            docker rm -f petdex-ssh >/dev/null 2>&1 || true
          }
          trap cleanup_remote_smoke EXIT

          # Dedicated throwaway SSH host and key. Container loopback keeps
          # the remote forward distinct from the app's runner-side :7777.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/ci_petdex -q
          docker run -d --name petdex-ssh -p 127.0.0.1:22222:22 ubuntu:24.04 sleep infinity
          docker exec petdex-ssh bash -lc \
            'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server curl python3 procps && useradd -m -s /bin/bash petdex && mkdir -p /run/sshd /home/petdex/.ssh'
          docker cp ~/.ssh/ci_petdex.pub petdex-ssh:/tmp/ci_petdex.pub
          docker exec petdex-ssh bash -lc \
            'cat /tmp/ci_petdex.pub > /home/petdex/.ssh/authorized_keys && chown -R petdex:petdex /home/petdex/.ssh && chmod 700 /home/petdex/.ssh && chmod 600 /home/petdex/.ssh/authorized_keys && ssh-keygen -A'
          docker exec -d petdex-ssh /usr/sbin/sshd -D -e

          REMOTE=(ssh -oBatchMode=yes -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=8 -p 22222 -i "$HOME/.ssh/ci_petdex" -- petdex@localhost)
          for _ in $(seq 1 20); do
            "${REMOTE[@]}" true >/dev/null 2>&1 && break
            sleep 1
          done
          "${REMOTE[@]}" true

          # The config the app reads at boot. opencode + codex cover both
          # writeback shapes; Hermes also exercises a custom remote home and
          # the two-watcher readiness handshake.
          mkdir -p ~/.petdex
          cat > ~/.petdex/remote-agents.json <<JSON
          {"remotes":[{"name":"loopback","host":"petdex@localhost","port":22222,
            "identity_file":"$HOME/.ssh/ci_petdex",
            "agents":{"opencode":{"enabled":true},"codex":{"enabled":true},
              "hermes":{"enabled":true,"home":"~/.hermes-ci"}}}]}
          JSON

          # Any earlier instance booted without this config and would not
          # re-run the sync.
          pkill -f petdex-desktop-native || true
          sleep 2
          export DISPLAY=:99
          xdpyinfo -display :99 >/dev/null 2>&1 || { Xvfb :99 -screen 0 1280x800x24 & sleep 3; }
          PETDEX_PET=ci-pet ./zig-out/bin/petdex-desktop-native > remote.log 2>&1 &
          APP_PID=$!

          # Token publication is the terminal gate: seeing it remotely proves
          # the tunnel health check and every preceding patch completed.
          for _ in $(seq 1 45); do
            "${REMOTE[@]}" 'test -s ~/.petdex/runtime/update-token' >/dev/null 2>&1 && break
            sleep 2
          done
          kill -0 "$APP_PID" || { echo "app died during remote sync"; cat remote.log; exit 1; }
          echo "=== app log ==="; cat remote.log

          # The pushed opencode plugin is byte-identical to the asset: it
          # POSTs directly and needs no remote-side helper.
          "${REMOTE[@]}" 'grep -q "HOOK_SERVER_URL" ~/.config/opencode/plugins/petdex.js' || {
            echo "FAIL: opencode plugin never landed"; exit 1; }
          # Codex's merged hooks point at the shared hook path...
          "${REMOTE[@]}" 'grep -q "petdex-hook" ~/.codex/hooks.json' || {
            echo "FAIL: codex hooks.json never landed"; "${REMOTE[@]}" 'cat ~/.codex/hooks.json' || true; exit 1; }
          "${REMOTE[@]}" 'grep -q "hooks = true" ~/.codex/config.toml' || {
            echo "FAIL: codex config.toml feature flag missing"; exit 1; }
          "${REMOTE[@]}" 'grep -q "petdex-hook" ~/.hermes-ci/config.yaml' || {
            echo "FAIL: custom-home Hermes config never landed"; exit 1; }
          "${REMOTE[@]}" 'grep -qx "$HOME/.hermes-ci" ~/.petdex/runtime/hermes-home' || {
            echo "FAIL: custom Hermes home was not published to the hook runtime"; exit 1; }
          # ...and that path carries the sh script, executable, with the
          # desktop runner's contract markers.
          "${REMOTE[@]}" 'test -x ~/.petdex/bin/petdex-hook' || {
            echo "FAIL: remote hook script missing or not executable"; exit 1; }
          "${REMOTE[@]}" 'grep -q "hooks-disabled" ~/.petdex/bin/petdex-hook' || {
            echo "FAIL: hook script lacks the killswitch"; exit 1; }
          "${REMOTE[@]}" 'test -s ~/.petdex/runtime/codex-watch.pid && test -s ~/.petdex/runtime/hermes-watch.pid && test -f ~/.petdex/runtime/tunnel-lease' || {
            echo "FAIL: watcher readiness was reported without live PID/lease files"; exit 1; }

          # Functional proof, not just file presence: invoke the pushed
          # script the way remote Codex would and assert it reached the
          # runner-side hook server through the established reverse tunnel.
          "${REMOTE[@]}" 'curl -fsS --max-time 2 http://127.0.0.1:7777/health' | grep -q '"ok":true'
          printf '%s\n' '{"tool_name":"Bash","session_id":"ci"}' | \
            "${REMOTE[@]}" '~/.petdex/bin/petdex-hook bubble pre codex'
          sleep 1
          # The hook server deliberately alternates running-left and
          # running-right sprite variants.  Both are successful running
          # states, so do not require the legacy bare "running" spelling.
          curl -fsS http://127.0.0.1:7777/state | grep -q '"state":"running' || {
            echo "FAIL: the pushed hook script never reached the hook server"
            curl -fsS http://127.0.0.1:7777/state || true; exit 1; }
          kill "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true
          # The tunnel owns the feed lease. Its exit revokes the token and
          # both detached watchers must clean up without waiting for another
          # Petdex launch.
          for _ in $(seq 1 15); do
            if "${REMOTE[@]}" 'test ! -e ~/.petdex/runtime/update-token && test ! -e ~/.petdex/runtime/codex-watch.pid && test ! -e ~/.petdex/runtime/hermes-watch.pid'; then
              break
            fi
            sleep 1
          done
          "${REMOTE[@]}" 'test ! -e ~/.petdex/runtime/update-token && test ! -e ~/.petdex/runtime/codex-watch.pid && test ! -e ~/.petdex/runtime/hermes-watch.pid' || {
            echo "FAIL: tunnel shutdown left a token or watcher alive"
            "${REMOTE[@]}" 'ls -la ~/.petdex/runtime; for p in ~/.petdex/runtime/*-watch.pid; do test -e "$p" || continue; printf "%s: " "$p"; cat "$p"; done'
            exit 1
          }
          APP_PID=

      - name: Upload the screenshot
        if: always() && matrix.platform != 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: screen-${{ matrix.platform }}
          path: |
            /tmp/linux-screen.png
            /tmp/linux-screen-cairo.png
            /tmp/linux-screen-deeplink.png
            ${{ runner.temp }}/windows-screen.png
            ${{ runner.temp }}/windows-screen-deeplink.png
          if-no-files-found: warn

      - name: Upload Linux test binary
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: petdex-desktop-native-linux-test
          path: packages/petdex-desktop-native/zig-out/bin/petdex-desktop-native
          if-no-files-found: error
