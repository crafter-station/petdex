<!-- Menu-bar template variant of public/brand/petdex-mark.svg: the host
     loads the PNG with `image.template = YES`, so only the alpha channel
     survives — the gradient body becomes the silhouette and the white
     face rects are punched out (evenodd) instead of painted. Rebuild the
     PNG from the repo root with:
       bun -e "require('sharp')(require('fs').readFileSync('packages/petdex-desktop-native/src/assets/tray-icon.svg'),{density:300}).resize(36,36).png().toFile('packages/petdex-desktop-native/src/assets/tray-icon.png')"
-->
