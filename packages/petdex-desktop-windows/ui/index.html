<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Petdex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      width: 192px;
      height: 288px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 192px;
      height: 208px;
      cursor: grab;
    }
    #root:active { cursor: grabbing; }

    .pet-sprite-frame {
      --pet-scale: 1;
      width: calc(192px * var(--pet-scale));
      height: calc(208px * var(--pet-scale));
      overflow: hidden;
      contain: layout paint;
    }

    .pet-sprite {
      --sprite-row: 0;
      --sprite-frames: 6;
      --sprite-duration: 1100ms;
      --sprite-y: calc(var(--sprite-row) * -208px);
      --sprite-end-x: calc(var(--sprite-frames) * -192px);
      width: 192px;
      height: 208px;
      background-image: var(--sprite-url);
      background-repeat: no-repeat;
      background-size: 1536px 1872px;
      image-rendering: pixelated;
      transform: scale(var(--pet-scale)) translateZ(0);
      transform-origin: top left;
      will-change: background-position;
      animation: pet-state var(--sprite-duration) steps(var(--sprite-frames)) infinite;
    }

    @keyframes pet-state {
      from { background-position: 0 var(--sprite-y); }
      to   { background-position: var(--sprite-end-x) var(--sprite-y); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pet-sprite { animation: none; }
    }

    #bubble {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.93);
      color: #111;
      font: 11px/1.4 system-ui, sans-serif;
      padding: 6px 10px;
      border-radius: 8px;
      max-width: 180px;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      white-space: pre-wrap;
    }
    #bubble.visible { opacity: 1; }

    #debug {
      position: fixed;
      top: 2px;
      left: 2px;
      font: 9px monospace;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    #init-banner, #update-card {
      position: fixed;
      left: 6px;
      right: 6px;
      bottom: 6px;
      padding: 6px 9px;
      border-radius: 9px;
      background: #ffffff;
      color: #111;
      font: 600 11px system-ui, -apple-system, sans-serif;
      box-shadow: 0 2px 6px rgba(0,0,0,0.30);
      display: none;
      cursor: pointer;
      pointer-events: auto;
      line-height: 1.25;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="bubble"></div>
    <div
      class="pet-sprite-frame"
      id="sprite-frame"
      role="img"
      aria-label="Petdex pet"
      style="--pet-scale: 1"
    >
      <div class="pet-sprite" id="sprite"></div>
    </div>
  </div>
  <div id="debug">loading...</div>
  <div id="init-banner">Run `npx petdex init` to wire your agents</div>
  <div id="update-card"></div>

<script type="module">
const { invoke } = window.__TAURI__.core;
const { getCurrentWindow } = window.__TAURI__.window;
const { listen } = window.__TAURI__.event;

const PET_STATES = {
  "idle":          { row: 0, frames: 6, durationMs: 1100 },
  "running-right": { row: 1, frames: 8, durationMs: 1060 },
  "running-left":  { row: 2, frames: 8, durationMs: 1060 },
  "waving":        { row: 3, frames: 4, durationMs:  700 },
  "jumping":       { row: 4, frames: 5, durationMs:  840 },
  "failed":        { row: 5, frames: 8, durationMs: 1220 },
  "waiting":       { row: 6, frames: 6, durationMs: 1010 },
  "running":       { row: 7, frames: 6, durationMs:  820 },
  "review":        { row: 8, frames: 6, durationMs: 1030 },
};

const DEFAULT_STATE = "idle";

let lastStateCounter = 0;
let lastBubbleCounter = 0;

function applyState(stateId) {
  const s = PET_STATES[stateId] ?? PET_STATES[DEFAULT_STATE];
  const sprite = document.getElementById("sprite");
  sprite.style.setProperty("--sprite-row", s.row);
  sprite.style.setProperty("--sprite-frames", s.frames);
  sprite.style.setProperty("--sprite-duration", `${s.durationMs}ms`);
}

async function boot() {
  try {
    const pet = await invoke("get_active_pet");
    if (!pet) { dbg("no pet found"); return; }

    const b64 = await invoke("read_file_as_base64", { path: pet.sprite_path })
      .catch((err) => { throw new Error(`spritesheet load failed: ${err}`); });
    const ext = pet.sprite_path.endsWith(".png") ? "png" : "webp";
    document.getElementById("sprite").style.setProperty(
      "--sprite-url",
      `url("data:image/${ext};base64,${b64}")`
    );
    applyState(DEFAULT_STATE);
    dbg(pet.name);

    startPolling();
  } catch (e) {
    dbg(`err: ${String(e).slice(0, 40)}`);
    console.error(e);
  }
}

function startPolling() {
  setInterval(pollState, 200);
  setInterval(pollBubble, 200);
  setInterval(pollInitStatus, 5000);
  setInterval(pollUpdate, 5000);
  setInterval(probeSidecar, 5000);
}

async function pollState() {
  try {
    const data = await invoke("read_runtime_state");
    if (!data) return;
    if (data.counter === lastStateCounter) return;
    lastStateCounter = data.counter;
    applyState(data.state ?? DEFAULT_STATE);
  } catch {}
}

async function pollBubble() {
  try {
    const data = await invoke("read_runtime_bubble");
    if (!data) return;
    if (data.counter === lastBubbleCounter) return;
    lastBubbleCounter = data.counter;
    showBubble(data.text ?? "");
  } catch {}
}

function showBubble(text) {
  const el = document.getElementById("bubble");
  if (!text) {
    el.textContent = "";
    el.classList.remove("visible");
    return;
  }
  el.textContent = text;
  el.classList.add("visible");
}

// ── Init banner ───────────────────────────────────────────────────────────────

async function pollInitStatus() {
  try {
    const info = await invoke("read_init_status");
    if (!info || typeof info !== "object") return;
    const banner = document.getElementById("init-banner");
    if (info.needsInit === true) {
      banner.style.display = "block";
    } else {
      banner.style.display = "none";
    }
  } catch {}
}

document.getElementById("init-banner").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText("npx petdex init");
    const banner = document.getElementById("init-banner");
    const prev = banner.textContent;
    banner.textContent = "Command copied. Paste in your terminal.";
    setTimeout(() => { banner.textContent = prev; }, 3000);
  } catch {}
});

// ── Update card ───────────────────────────────────────────────────────────────

let lastUpdateSig = "";

function renderUpdate(info) {
  const card = document.getElementById("update-card");
  if (info.status === "idle" || (!info.available && info.status !== "error" && info.status !== "done")) {
    card.style.display = "none";
    return;
  }
  let text = "";
  if (info.status === "available") {
    text = "Update " + (info.latest || "available") + " - click to install";
  } else if (info.status === "running") {
    text = info.message || "Updating...";
  } else if (info.status === "done") {
    text = info.message || "Update installed. Restart Petdex.";
  } else if (info.status === "error") {
    text = info.message || "Update failed.";
  }
  card.textContent = text;
  card.style.display = "block";
}

async function pollUpdate() {
  try {
    const info = await invoke("read_update_info");
    if (!info || typeof info !== "object") return;
    const sig = info.status + ":" + (info.latest || "") + ":" + (info.message || "");
    if (sig === lastUpdateSig) return;
    lastUpdateSig = sig;
    renderUpdate(info);
  } catch {}
}

document.getElementById("update-card").addEventListener("click", async () => {
  try {
    const r = await invoke("trigger_update");
    if (r && r.ok === false) {
      const code = r.error || "";
      if (code.indexOf("curl_exit_") === 0 || code === "no_token" || code === "token_read" || code === "empty_token") {
        renderUpdate({ status: "error", message: "Sidecar offline. Run: npx petdex@latest update" });
        return;
      }
      renderUpdate({ status: "error", message: "Update failed (" + code + "). Run: npx petdex@latest update" });
      return;
    }
    renderUpdate({ status: "running", message: "Updating..." });
  } catch {
    renderUpdate({ status: "error", message: "Update failed. Run: npx petdex@latest update" });
  }
});

// ── Sidecar watchdog ──────────────────────────────────────────────────────────

let sidecarFails = 0;
let lastRespawnAt = 0;

async function probeSidecar() {
  try {
    const r = await fetch("http://127.0.0.1:7777/health", {
      signal: AbortSignal.timeout(500),
    });
    if (r.ok) {
      sidecarFails = 0;
      return;
    }
  } catch {}
  sidecarFails += 1;
  if (sidecarFails < 3) return;
  const now = Date.now();
  if (now - lastRespawnAt < 4000) return;
  lastRespawnAt = now;
  try {
    await invoke("respawn_sidecar");
    sidecarFails = 0;
  } catch {}
}

// ── Drag ──────────────────────────────────────────────────────────────────────

document.getElementById("root").addEventListener("mousedown", async () => {
  try { await getCurrentWindow().startDragging(); } catch {}
});

// ── Deep link ─────────────────────────────────────────────────────────────────

listen("petdex:deep-link", (event) => {
  const url = event.payload;
  if (!url || !url.startsWith("petdex://")) return;
  const slug = new URL(url).hostname;
  if (/^[a-z0-9_-]{1,64}$/.test(slug)) {
    activateOrInstall(slug);
  }
});

async function activateOrInstall(slug) {
  try {
    await invoke("set_active", { slug });
    location.reload();
    return;
  } catch {}
  showBubble("Installing " + slug + "...");
  try {
    const r = await invoke("install_pet", { slug });
    if (r && r.ok) {
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          await invoke("set_active", { slug });
          location.reload();
          return;
        } catch {
          if (attempt === 0) {
            await new Promise(res => setTimeout(res, 500));
            continue;
          }
          showBubble("Installed. Restart Petdex to use " + slug);
          return;
        }
      }
      return;
    }
    const err = (r && r.error) || "unknown";
    try { await invoke("set_mascot_state", { state: "failed" }); } catch {}
    showBubble("Install failed: " + err);
  } catch {
    try { await invoke("set_mascot_state", { state: "failed" }); } catch {}
    showBubble("Install crashed");
  }
}

// ── Right-click quit ──────────────────────────────────────────────────────────

window.addEventListener("contextmenu", async (e) => {
  e.preventDefault();
  await invoke("stop_sidecar");
  await invoke("quit_app");
});

function dbg(msg) {
  document.getElementById("debug").textContent = msg;
}

boot();
</script>
</body>
</html>
