<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Petdex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: -apple-system, system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body { pointer-events: none; }

    #root {
      position: fixed;
      left: 8px;
      top: 34px;
      pointer-events: none;
    }

    /* Scale 0.55 matches macOS 51% window width ratio (105px in 192px window) */
    .pet-sprite-frame {
      --pet-scale: 0.55;
      position: relative;
      width: calc(192px * var(--pet-scale));
      height: calc(208px * var(--pet-scale));
      overflow: hidden;
      pointer-events: auto;
      cursor: grab;
    }
    .pet-sprite-frame:active { cursor: grabbing; }

    .pet-sprite {
      --sprite-row: 0;
      --sprite-frames: 6;
      --sprite-duration: 1100ms;
      --sprite-y: calc(var(--sprite-row) * -208px);
      --sprite-end-x: calc(var(--sprite-frames) * -192px);
      width: 192px;
      height: 208px;
      background-image: var(--sprite-url);
      background-repeat: no-repeat;
      background-size: 1536px auto;
      image-rendering: pixelated;
      transform: scale(var(--pet-scale)) translateZ(0);
      transform-origin: top left;
      will-change: background-position;
      animation: pet-state var(--sprite-duration) steps(var(--sprite-frames)) infinite;
    }

    @keyframes pet-state {
      from { background-position: 0 var(--sprite-y); }
      to   { background-position: var(--sprite-end-x) var(--sprite-y); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pet-sprite { animation: none; }
    }

    /* Verbatim from macOS main.zig — bubbleEl with avatar support */
    #bubble {
      position: fixed;
      padding: 4px 8px;
      border-radius: 10px;
      background: #ffffff;
      color: #111;
      font: 600 11px system-ui, -apple-system, sans-serif;
      line-height: 1.2;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.30);
      text-align: left;
      white-space: normal;
      max-width: 190px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="root">
    <div
      class="pet-sprite-frame"
      id="sprite-frame"
      role="img"
      aria-label="Petdex pet"
    >
      <div class="pet-sprite" id="sprite"></div>
    </div>
  </div>
  <div id="bubble"></div>

<script type="module">
const { invoke } = window.__TAURI__.core;
const { getCurrentWindow } = window.__TAURI__.window;

// Verbatim from src/lib/pet-states.ts
const PET_STATES = {
  "idle":          { row: 0, frames: 6, durationMs: 1100 },
  "running-right": { row: 1, frames: 8, durationMs: 1060 },
  "running-left":  { row: 2, frames: 8, durationMs: 1060 },
  "waving":        { row: 3, frames: 4, durationMs:  700 },
  "jumping":       { row: 4, frames: 5, durationMs:  840 },
  "failed":        { row: 5, frames: 8, durationMs: 1220 },
  "waiting":       { row: 6, frames: 6, durationMs: 1010 },
  "running":       { row: 7, frames: 6, durationMs:  820 },
  "review":        { row: 8, frames: 6, durationMs: 1030 },
};

const DEFAULT_STATE = "idle";

let lastStateCounter = 0;
let lastBubbleCounter = 0;
let bubbleAvatarEl = null;
let bubbleTextEl = null;

// Verbatim from macOS main.zig L445-L454
const AGENT_AVATARS = {
  'claude-code': 'agents/claude-code.svg',
  'codex': 'agents/codex.svg',
  'gemini': 'agents/gemini.svg',
  'opencode': 'agents/opencode.svg',
  'antigravity': 'agents/antigravity.svg',
};
function agentAvatarSrc(source) {
  return AGENT_AVATARS[source] || 'agents/fallback.svg';
}

function applyState(stateId) {
  const s = PET_STATES[stateId] ?? PET_STATES[DEFAULT_STATE];
  const sprite = document.getElementById("sprite");
  sprite.style.setProperty("--sprite-row", s.row);
  sprite.style.setProperty("--sprite-frames", s.frames);
  sprite.style.setProperty("--sprite-duration", `${s.durationMs}ms`);
}

async function boot() {
  try {
    const pet = await invoke("get_active_pet");
    if (!pet) return;

    const b64 = await invoke("read_file_as_base64", { path: pet.sprite_path })
      .catch((err) => { throw new Error(`spritesheet load failed: ${err}`); });
    const ext = pet.sprite_path.endsWith(".png") ? "png" : "webp";
    const dataUrl = `url("data:image/${ext};base64,${b64}")`;
    const spriteEl = document.getElementById("sprite");
    spriteEl.style.backgroundImage = dataUrl;
    spriteEl.style.backgroundRepeat = "no-repeat";
    spriteEl.style.setProperty("--sprite-url", dataUrl);
    applyState(DEFAULT_STATE);

    await bootSidecar();
  } catch (e) {
    console.error(e);
  }
}

function startPolling() {
  setInterval(pollState, 200);
  setInterval(pollBubble, 200);
}

async function bootSidecar() {
  startPolling();
  try {
    await invoke("spawn_sidecar");
  } catch (e) {
    console.warn("sidecar spawn failed:", e);
  }
}

async function pollState() {
  try {
    const data = await invoke("read_runtime_state");
    if (!data) return;
    if (data.counter === lastStateCounter) return;
    lastStateCounter = data.counter;
    applyState(data.state ?? DEFAULT_STATE);
  } catch {}
}

async function pollBubble() {
  // Hide bubble if picker menu is open (verbatim macOS main.zig L563-L570)
  if (document.querySelector('.menu')) {
    const el = document.getElementById("bubble");
    if (el) el.style.opacity = '0';
    return;
  }
  try {
    const data = await invoke("read_runtime_bubble");
    if (!data) return;
    if (data.counter === lastBubbleCounter) return;
    lastBubbleCounter = data.counter;

    // Reset pet to default top:34 before measuring new bubble (verbatim macOS main.zig L589-L597)
    const stageEl = document.getElementById("root");
    if (stageEl && stageEl.style.top !== '34px') {
      stageEl.style.top = '34px';
    }

    showBubble(data.text ?? "", data.agent_source ?? "");
  } catch {}
}

function ensureBubble() {
  const el = document.getElementById("bubble");
  if (bubbleTextEl) return el;
  el.innerHTML = "";
  bubbleAvatarEl = document.createElement("img");
  bubbleAvatarEl.alt = "Agent avatar";
  bubbleAvatarEl.decoding = "async";
  bubbleAvatarEl.style.cssText = "width:20px;height:20px;flex:0 0 auto;object-fit:cover;display:block;";
  
  bubbleTextEl = document.createElement("span");
  bubbleTextEl.style.cssText = "display:block;min-width:0;word-break:keep-all;overflow-wrap:break-word;";
  
  el.appendChild(bubbleAvatarEl);
  el.appendChild(bubbleTextEl);
  return el;
}

function showBubble(text, agentSource) {
  const el = document.getElementById("bubble");
  if (!text) {
    el.style.opacity = "0";
    // Restore pet to default position (verbatim macOS main.zig L604-L607)
    const stageEl = document.getElementById("root");
    if (stageEl && stageEl.style.top !== '34px') {
      stageEl.style.top = '34px';
    }
    return;
  }
  ensureBubble();
  const source = typeof agentSource === 'string' ? agentSource : '';
  bubbleAvatarEl.src = agentAvatarSrc(source);
  bubbleAvatarEl.alt = source ? source + ' avatar' : 'Agent avatar';
  bubbleTextEl.textContent = text;
  positionBubbleNearPet(el);
  el.style.opacity = "1";
}

/* Verbatim from macOS main.zig — positionBubbleNearPet */
function positionBubbleNearPet(el) {
  const pet = document.getElementById("sprite-frame");
  const rect = pet.getBoundingClientRect();
  const bh = el.offsetHeight || 22;
  const ww = window.innerWidth;
  const gap = 14; // Official macOS gap (main.zig L514)
  const petCenterX = rect.left + rect.width / 2;
  const realBw = el.offsetWidth;
  const desiredLeft = petCenterX - realBw / 2;
  const left = Math.max(4, Math.min(ww - realBw - 4, desiredLeft));

  const stageEl = document.getElementById("root");
  const currentPetTop = parseInt(stageEl.style.top || '34', 10);
  let top = rect.top - bh - gap;
  if (top < 2) {
    const newPetTop = bh + gap + 4;
    if (newPetTop > currentPetTop) {
      stageEl.style.top = newPetTop + 'px';
      const rect2 = pet.getBoundingClientRect();
      top = Math.max(2, rect2.top - bh - gap);
    } else {
      top = Math.max(2, top);
    }
  }

  el.style.left = left + 'px';
  el.style.top = top + 'px';
}

document.getElementById("sprite-frame").addEventListener("mousedown", async () => {
  try { await getCurrentWindow().startDragging(); } catch {}
});

window.addEventListener("contextmenu", async (e) => {
  e.preventDefault();
  await invoke("stop_sidecar");
  await invoke("quit_app");
});

boot();
</script>
</body>
</html>
