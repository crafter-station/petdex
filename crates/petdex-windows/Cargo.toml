[package]
name = "petdex-windows"
version = "0.1.0"
edition = "2021"
description = "Native Windows desktop shell for Petdex backed by petdex-core"

[dependencies]
petdex-core = { path = "../petdex-core" }
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
